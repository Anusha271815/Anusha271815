name: Update PRs in README

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight
  workflow_dispatch:       # allow manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Update PRs
        uses: abhisheknaiidu/pr-update-action@main
        with:
          GH_USERNAME: "Anusha271815"
          COMMIT_MESSAGE: "chore: updated PRs in README"
          MAX_PR: 5
          PR_STATE: "MERGED"   # can be OPEN, CLOSED, MERGED

      - name: Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: updated PRs in README" || echo "No changes to commit"
          git push

         
